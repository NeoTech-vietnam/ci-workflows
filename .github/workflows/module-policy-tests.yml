name: Module integration policy tests
on:
  push:
    branches: [main]
    paths: ['actions/module-integration/**', 'test/**', '.github/workflows/module*.yml']
  pull_request:
    paths: ['actions/module-integration/**', 'test/**', '.github/workflows/module*.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML>=6.0,<7'
      - run: python -m unittest discover -s test -p 'test_*.py'
