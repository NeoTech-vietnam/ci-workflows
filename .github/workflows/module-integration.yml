name: Reusable module reference integration
on:
  workflow_call:
    inputs:
      config:
        type: string
        default: ci_targets.yml
    secrets:
      INTEGRATION_DISPATCH_TOKEN:
        description: Actions-write and Contents-read token for selected reference-project repositories
        required: true
permissions:
  contents: read
jobs:
  reference-builds:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML reader
        run: python -m pip install 'PyYAML>=6.0,<7'
      - name: Dispatch and follow reference builds
        uses: NeoTech-vietnam/ci-workflows/actions/module-integration@v1.3.1
        with:
          config: ${{ inputs.config }}
          token: ${{ secrets.INTEGRATION_DISPATCH_TOKEN }}
      - name: Upload reference-build results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-integration-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 14
          if-no-files-found: warn
          path: _out/module-integration-results.json
