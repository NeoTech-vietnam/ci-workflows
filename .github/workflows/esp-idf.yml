name: Reusable ESP-IDF integration

on:
  workflow_call:
    inputs:
      idf-version:
        description: Official Espressif Docker image version
        type: string
        default: v6.0.1
      target:
        description: ESP-IDF chip target
        type: string
        default: esp32s3
      package:
        description: Optional package override from the caller's manifest
        type: string
        default: ''
      package-ref:
        description: Branch, tag or commit to use for that package
        type: string
        default: ''
    secrets:
      PACKAGE_READ_TOKEN:
        description: Contents-read token for the caller's private module repositories
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check private-module credential
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
        run: |
          if [[ -z "$PACKAGE_READ_TOKEN" ]]; then
            echo '::error title=Missing module credential::Add repository Actions secret PACKAGE_READ_TOKEN with Contents: read access to the private module repositories.'
            exit 1
          fi
      - name: Checkout calling project
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host test dependencies
        run: python -m pip install -r TOOLCONF/requirements-dev.txt
      - name: Fetch selected package commits
        env:
          PACKAGE_READ_TOKEN: ${{ secrets.PACKAGE_READ_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package }}
          PACKAGE_REF: ${{ inputs.package-ref }}
        run: |
          set -euo pipefail
          args=(fetch)
          if [[ -n "$PACKAGE_NAME" || -n "$PACKAGE_REF" ]]; then
            [[ -n "$PACKAGE_NAME" && -n "$PACKAGE_REF" ]] || { echo 'Supply both package and package_ref'; exit 1; }
            args+=(--ref "$PACKAGE_NAME=$PACKAGE_REF")
          fi
          auth="$(printf 'x-access-token:%s' "$PACKAGE_READ_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth"
          python TOOLCONF/workspace.py "${args[@]}"
      - name: Run project host regressions
        run: |
          mkdir -p _out
          python test/run_host_tests.py 2>&1 | tee _out/host-tests.log
      - name: Build firmware in the official ESP-IDF environment
        env:
          IDF_VERSION: ${{ inputs.idf-version }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          [[ "$IDF_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a pinned vX.Y.Z SDK version'; exit 1; }
          [[ "$TARGET" =~ ^esp32[a-z0-9]*$ ]] || { echo 'Invalid ESP-IDF target'; exit 1; }
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e IDF_GIT_SAFE_DIR=/project:/opt/esp/idf -e IDF_TARGET="$TARGET" \
            -v "$GITHUB_WORKSPACE:/project" -w /project \
            "espressif/idf:$IDF_VERSION" idf.py -B "_build/$TARGET" build \
            2>&1 | tee _out/firmware-build.log
      - name: Check firmware and memory configuration
        env:
          TARGET: ${{ inputs.target }}
        run: python TOOLCONF/check_build.py "_build/$TARGET" 2>&1 | tee _out/firmware-check.log
      - name: Upload provenance, reports and firmware
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ inputs.target }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            _out/
            _build/${{ inputs.target }}/*.bin
            _build/${{ inputs.target }}/*.elf
            _build/${{ inputs.target }}/*.map
            _build/${{ inputs.target }}/flasher_args.json
            _build/${{ inputs.target }}/bootloader/bootloader.bin
            _build/${{ inputs.target }}/partition_table/partition-table.bin
